<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de compras</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header></header>

    <main class="carrito-main">
        <h2>Tu Carrito de Compras</h2>

        <div id="carrito-productos-container"></div>
            

        <div id="carrito-vacio" style="display: none;">
            <p>Tu carrito está vacío.</p>
            <a href="../pages/productos.html" class="btn-volver">Volver a la tienda</a>
        </div>

        <div id="carrito-footer">
            <p class="carrito-total-texto">Total: <span id="carrito-total-monto">$0</span></p>
            <button id="btn-vaciar-carrito" class="btn-rojo">Vaciar Carrito</button>
            <button id="btn-comprar" class="btn-verde">Finalizar Compra</button>
        </div>
    </main>


    
    <footer class="footer">
            <p>Seguinos en redes</p>
            <div class="redes">
                <a href="#">Instagram</a>
                <a href="#">Facebook</a>
                <a href="#">Twitter / X</a>
            </div>
            <p class="copy">© 2025 Smash Tenis — Todos los derechos reservados</p>
    </footer> 
    <script type="module" src="../js/navbar.js" ></script>
    <script type="module" src="../js/carrito.js" ></script>
</body>
</html>
